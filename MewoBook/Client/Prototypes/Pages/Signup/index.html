<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="signup-page">
    <div class="signup-box">
        <h2>Sign up</h2>
        <p class="text-muted">MioBook</p>
        <form class="d-flex flex-column gap-3">
            <div class="mb-3 input-field">
                <input type="text" class="form-control" placeholder="Username" required>
            </div>
            <div class="mb-3 input-field">
                <input type="password" class="form-control" placeholder="Password" required>
            </div>
            <div class="mb-3 input-field">
                <input type="email" class="form-control" placeholder="Email" required>
            </div>
            <div class="row mb-3 row-field">
                <div class="col">
                    <input type="text" class="form-control" placeholder="Country" required>
                </div>
                <div class="col">
                    <input type="text" class="form-control" placeholder="City" required>
                </div>
            </div>
            <div class="row mb-3 row-field">
                <p class="mb-2 text-start">I am</p>
                <div class="col d-flex align-items-center">
                    <input type="radio" class="btn-check" name="userType" id="customer" checked>
                    <label class="btn btn-outline-primary w-100 d-flex align-items-center justify-content-center" for="customer">
                        <img src="./assets/Customer-Icon.svg" alt="Customer" width="20" height="20" class="me-2"> Customer
                    </label>
                </div>
                <div class="col d-flex align-items-center">
                    <input type="radio" class="btn-check" name="userType" id="manager">
                    <label class="btn btn-outline-primary w-100 d-flex align-items-center justify-content-center" for="manager">
                        <img src="./assets/Manager-Icon.svg" alt="Manager" width="20" height="20" class="me-2"> Manager
                    </label>
                </div>
            </div>
            <div class="signup-btn d-flex flex-column gap-2">
                <button type="submit" class="btn btn-primary w-100 mt-3">Sign Up</button>
                <p class="have-acc-txt">Already have an account? <a class="signIn-link" href="">Sign in</a> </p>
            </div>
        </form>
    </div>
</div>
    <div class="footer text-center">
        Copyright © 2025 - MioBook
    </div>
</body>
</html>
